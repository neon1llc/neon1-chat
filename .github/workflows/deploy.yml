# .github/workflows/deploy.yml - Apply the stack from main, which also ships the function code,
# then check the live endpoint. Off until the repository variable AWS_TERRAFORM_ROLE_ARN is set.

name: deploy

# Pushes to main that change anything that ships (the app, its locked dependencies, the
# packaging and verification scripts) or the infrastructure, or a manual run
on:
  push:
    branches: [main]
    paths: ["app/**", "infra/**", "package.json", "package-lock.json", "scripts/package.mjs", "scripts/verify-release.mjs", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# Read-only by default; the job adds the OIDC token it needs
permissions:
  contents: read

jobs:
  # Full history, so a secret in any commit stops the deploy. The image is pinned by digest
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner .

  # Nothing ships unless the secret scan passed on this same commit
  deploy:
    needs: secrets
    if: vars.AWS_TERRAFORM_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Let a running deploy finish; the next one starts after it
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same tests as CI; nothing ships that fails them
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # A CycloneDX inventory of what ships (production dependencies only), kept with the run
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # The release folder Terraform zips: source, listed corpus, pinned SDK, and release.json
      - run: node scripts/package.mjs

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Short-lived credentials through GitHub OIDC; the role trusts only this repo's main branch
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      # Apply exactly the plan that was printed
      - name: Plan
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra plan -input=false -no-color -out=tfplan
      - name: Apply
        run: terraform -chdir=infra apply -input=false -no-color tfplan

      # The live assistant answers its health check through neon1.tech with this commit, corpus,
      # and lockfile; anything else (an old version still serving, say) fails the job
      - name: Verify
        run: node scripts/verify-release.mjs https://neon1.tech/chat/api/health
