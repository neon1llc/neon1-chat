# .github/workflows/ci.yml - Check every push and pull request: tests, Terraform, and secrets.

name: ci

# Every branch push, plus pull requests into main; refresh.yml starts it by hand on its corpus
# branch, since a push made with the workflow token starts nothing on its own
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token; CI never writes to the repo
permissions:
  contents: read

jobs:
  # Unit tests run with AWS faked out, so they need no credentials
  app:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22, matching the Lambda runtime, with the npm cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  # Terraform formatting and validation need no AWS access
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - run: terraform fmt -check -recursive -diff infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate -no-color

  # Full history, so a secret in any commit fails the build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner .
